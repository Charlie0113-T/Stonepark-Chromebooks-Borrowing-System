databases:
  - name: stonepark-db
    plan: free
    databaseName: stonepark_chromebook
    user: stonepark

services:
  - type: web
    name: stonepark-chromebook-api
    plan: free
    region: oregon
    runtime: node
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PGSSLMODE
        value: require
      - key: AUTH_BYPASS
        value: "false"
      - key: WHITELIST_SEED
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: STAFF_USERS
        sync: false
      # Left unset, the API allows every origin (see backend/index.js). Pin it
      # to the frontend teachers actually use.
      - key: CORS_ORIGIN
        value: https://stonepark-chromebook-manager.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: stonepark-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # WEBAUTHN_RP_ID is the FRONTEND domain (not this API's domain) — the
      # host teachers actually visit. Passkeys are permanently bound to it:
      # changing this value invalidates every staff passkey and forces
      # everyone to re-register. Do not edit without planning that migration.
      - key: WEBAUTHN_RP_ID
        value: stonepark-chromebook-manager.vercel.app
      - key: WEBAUTHN_ORIGIN
        value: https://stonepark-chromebook-manager.vercel.app
      - key: WEBAUTHN_RP_NAME
        value: Stonepark Chromebook Manager
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_FROM
        sync: false
      - key: NOTIFY_TO
        sync: false

  - type: web
    name: stonepark-chromebook-frontend
    plan: free
    region: oregon
    runtime: static
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://stonepark-chromebooks-borrowing-system.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
